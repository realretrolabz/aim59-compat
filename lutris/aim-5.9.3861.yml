name: AOL Instant Messenger 5.9
game_slug: aim-5-9
version: 5.9.3861 Wine 9.0 compatibility + Wine 10.0 test
slug: aim-5-9-3861-wine-compat
runner: wine

script:
  game:
    exe: '$GAMEDIR/prefix/drive_c/Program Files/AIM/aim.exe'
    prefix: $GAMEDIR/prefix
    arch: win32
    working_dir: '$GAMEDIR/prefix/drive_c/Program Files/AIM'

  files:
  - aim59_bundle:
      url: https://github.com/realretrolabz/aim59-compat/releases/download/v0.1.2/aim59-compat-0.1.2-linux.tar.gz
      filename: aim59-compat-0.1.2-linux.tar.gz
      checksum: 'sha256:fe2eb80203c6472acfc9e1599b7867818378dec54e3db77c62230b1d277ef611'

  installer:
  - extract:
      file: aim59_bundle
      dst: $CACHE
  - execute:
      command: |
        set -e
        python3 -u "$CACHE/aim59" setup \
          --source oldversion \
          --non-interactive \
          --yes \
          --cache-dir "$CACHE/aim59-installer" \
          --prefix "$GAMEDIR/prefix"
      disable_runtime: true

  wine:
    version: system
    dxvk: false
    overrides:
      mciwave: n,b
