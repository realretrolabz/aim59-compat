name: AOL Instant Messenger 5.9
game_slug: aim-5-9
version: 5.9.3861 Wine 9.0 compatibility + Wine 10.0 test
slug: aim-5-9-3861-wine-compat
runner: linux

script:
  game:
    exe: /usr/bin/env
    args: 'WINEPREFIX="$GAMEDIR/prefix" wine "$GAMEDIR/prefix/drive_c/Program Files/AIM/aim.exe"'
    working_dir: '$GAMEDIR/prefix/drive_c/Program Files/AIM'

  files:
  - aim59_bundle:
      url: https://github.com/realretrolabz/aim59-compat/releases/download/v0.1.3/aim59-compat-0.1.3-linux.tar.gz
      filename: aim59-compat-0.1.3-linux.tar.gz
      checksum: 'sha256:648db8479d23739c4334ee408c67d5036555ddb785dfaca0bf5c6e79755f75bb'

  installer:
  - extract:
      file: aim59_bundle
      dst: $CACHE
  - execute:
      command: |
        set -e
        python3 -u "$CACHE/aim59" setup \
          --source oldversion \
          --non-interactive \
          --yes \
          --cache-dir "$CACHE/aim59-installer" \
          --prefix "$GAMEDIR/prefix"
      disable_runtime: true

  system:
    disable_runtime: true
